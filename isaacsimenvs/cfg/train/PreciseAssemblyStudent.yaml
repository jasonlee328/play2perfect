# Depth-vision student for DAgger distillation from the tight_insertion teacher.
#
# Modelled on DEXTRAH's rl_games_ppo_lstm_scratch_cnn_aux.yaml. Only the
# `network:` block and a few `config:` entries are actually consumed: DAgger
# builds the model through rl_games' ModelBuilder but runs its own training
# loop, so the PPO-specific settings below (gamma, e_clip, mini_epochs, ...) are
# inert. They are kept so the file stays loadable by rl_games' Runner and so the
# diff against the DEXTRAH original stays readable.
params:
  seed: 65

  env:
    # The student's proprio is already clamped to +-10 by the env
    # (obs.clamp_abs_observations); this matches. Note DEXTRAH used 5.0.
    clip_observations: 10.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: a2c_aux_cnn_net
    separate: False          # single trunk; the builder rejects True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        # A learned constant sigma. Note the TEACHER's sigmas are unusable as
        # loss weights (they index only on the SAPG block id and span 1054x --
        # see isaacsimenvs/distillation/teacher.py); Phase 5 weights uniformly.
        fixed_sigma: True

    mlp:
      units: [512, 512, 256]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: lstm
      units: 512
      layers: 1
      before_mlp: True       # builder requires True
      layer_norm: True

    aux_network:
      mlp:
        units: [512, 256]
        activation: elu
        out_activation: None  # plain nn.Linear on each head's output
        d2rl: False
        initializer:
          name: default
        regularizer:
          name: None

    # Auxiliary regression targets, matching PreciseAssemblyEnv._aux_info().
    # Deviates from DEXTRAH's {object_pos} on purpose: here the object is
    # already grasped, so its pose is largely recoverable from the 87 proprio
    # numbers. The genuinely hidden quantity is the hole.
    aux_outputs:
      hole_pos: {size: 3}             # the primary unknown
      keypoints_rel_goal: {size: 12}  # the teacher's literal decision input
      object_pos: {size: 3}           # cheap encoder grounding

  load_checkpoint: False
  load_path: ''

  config:
    name: precise_assembly_student
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    normalize_input: True    # model-level RunningMeanStd over the 87 proprio
    normalize_value: True
    num_actors: -1           # set from num_envs by the entry point

    # --- consumed by the DAgger loop (Phase 5) ---
    learning_rate: 1e-4      # DEXTRAH's constant LR, tuned at 256 envs
    grad_norm: 1.0
    truncate_grads: True
    # DEFAULTS BELOW MATCH DEXTRAH'S ACTUAL BEHAVIOUR, not this port's opinion
    # of it. Where DEXTRAH's committed code contradicts its own written intent
    # (a 15k beta warmup it clobbers to 0, a seq_length it reads then overwrites
    # with 1), the committed behaviour wins here. `distill.py --port-deviations`
    # switches the whole group to this port's alternatives; each also has its own
    # flag. Rationale for every alternative is in isaacsimenvs/distillation/
    # dagger.py, with the measurements behind it.
    seq_length: 1            # DEXTRAH: reads config, then `self.seq_length = 1`
                             # (distillation.py:177). BPTT length 1.
    aux_coeff: 10.0          # DEXTRAH's weight on the summed aux losses
    # DEXTRAH's losses are L2 NORMS -- torch.norm(err, dim=-1) then mean over
    # the batch (distillation.py:47-54, l2 / weighted_l2) -- for the mu, sigma
    # and aux terms alike. Not mean-squared-error. The gradient of a norm is
    # constant in the error while MSE's decays with it, so MSE stalls exactly
    # as the student gets close. Set "mse" to recover the old behaviour.
    loss_form: l2_norm
    mu_weight_mode: inv_sigma2   # DEXTRAH: weights = (1/teacher_sigmas[0])**2
    sigma_loss_coef: 1.0     # DEXTRAH includes the L2-on-sigmas term
    # Teacher-driven warmup, in GRADIENT steps (not env steps). DEXTRAH
    # hardcodes beta=0, which is only safe because its geometric fabric bounds
    # the reachable state set; play2perfect commands 29 raw joint targets and
    # has no fabric. Their written-but-clobbered threshold was 15000, which was
    # env steps AND gradient steps at once because they forced seq_length=1.
    # At seq_length=16 those differ 16x, and student competence tracks gradient
    # steps -- so that is the unit here. 15000 grad steps = 240k env steps.
    beta_warmup_grad_steps: 0      # DEXTRAH: `beta = 0.` unconditionally
                                   # (distillation.py:376), clobbering the
                                   # 15000-iteration warmup written two lines
                                   # above it. The student steers from step 0.
    beta_anneal_grad_steps: 0
    max_iters: 100000

    # --- inert: PPO settings kept for Runner compatibility ---
    ppo: True
    mixed_precision: False
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    entropy_coef: 0.0
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    bounds_loss_coef: 0.0001

    player:
      deterministic: True
      games_num: 100000
      print_stats: False
